<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nawala Monitor - Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        :root {
            --background: #f4f6fa;
            --surface: #ffffff;
            --surface-soft: #fafbfc;

            --text: #172033;
            --text-secondary: #657089;
            --muted: #8993a6;

            --border: #e4e8ef;

            --primary: #315efb;
            --primary-hover: #244bd3;

            --green: #16a36a;
            --green-bg: #e8f8f1;

            --red: #e04444;
            --red-bg: #fff0f0;

            --blue-bg: #edf2ff;

            --shadow:
                0 18px 50px
                rgba(25, 35, 55, .08);
        }


        body.dark {
            --background: #0f141d;
            --surface: #171d28;
            --surface-soft: #1b222e;

            --text: #f1f4f9;
            --text-secondary: #aeb7c7;
            --muted: #7f8a9e;

            --border: #293241;

            --blue-bg: #1b2a52;
            --green-bg: #123a2c;
            --red-bg: #401f22;

            --shadow:
                0 18px 50px
                rgba(0, 0, 0, .25);
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                var(--background);

            color:
                var(--text);

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            transition:
                background .25s,
                color .25s;
        }


        /* BACKGROUND */

        .page-background {
            position: fixed;
            inset: 0;

            pointer-events: none;
            overflow: hidden;
        }


        .background-circle {
            position: absolute;

            border-radius: 50%;

            filter: blur(1px);

            opacity: .45;
        }


        .circle-one {
            width: 320px;
            height: 320px;

            top: -160px;
            right: -100px;

            background:
                rgba(49, 94, 251, .08);
        }


        .circle-two {
            width: 260px;
            height: 260px;

            bottom: -120px;
            left: -100px;

            background:
                rgba(22, 163, 106, .06);
        }


        /* LOGIN WRAPPER */

        .login-wrapper {
            position: relative;

            width: min(430px, 100%);

            animation:
                loginAppear .45s ease;
        }


        @keyframes loginAppear {

            from {
                opacity: 0;
                transform:
                    translateY(12px)
                    scale(.98);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }

        }


        /* CARD */

        .login-card {
            position: relative;

            background:
                var(--surface);

            border:
                1px solid
                var(--border);

            border-radius:
                18px;

            box-shadow:
                var(--shadow);

            overflow: hidden;
        }


        .top-line {
            width: 100%;
            height: 4px;

            background:
                var(--primary);
        }


        .login-content {
            padding:
                34px 34px 30px;
        }


        /* BRAND */

        .brand {
            display: flex;
            align-items: center;

            gap: 13px;

            margin-bottom: 28px;
        }


        .brand-icon {
            width: 48px;
            height: 48px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            background:
                var(--primary);

            color: #fff;

            font-size: 22px;
            font-weight: 800;

            box-shadow:
                0 8px 20px
                rgba(49, 94, 251, .20);
        }


        .brand-text h1 {
            font-size: 19px;
            line-height: 1.2;

            margin-bottom: 4px;
        }


        .brand-text p {
            color:
                var(--muted);

            font-size: 11px;
        }


        /* HEADER */

        .login-title {
            margin-bottom: 7px;

            font-size: 23px;
            font-weight: 750;
        }


        .login-subtitle {
            margin-bottom: 24px;

            color:
                var(--text-secondary);

            font-size: 11px;

            line-height: 1.6;
        }


        /* FORM */

        .form-group {
            margin-bottom: 16px;
        }


        .form-label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 7px;
        }


        .form-label {
            color:
                var(--text);

            font-size: 10px;
            font-weight: 700;
        }


        .field-wrap {
            position: relative;
        }


        .field-icon {
            position: absolute;

            left: 13px;
            top: 50%;

            transform:
                translateY(-50%);

            color:
                var(--muted);

            font-size: 13px;

            pointer-events: none;
        }


        .field-input {
            width: 100%;
            height: 44px;

            padding:
                0 44px 0 38px;

            border:
                1px solid
                var(--border);

            border-radius: 9px;

            outline: none;

            background:
                var(--surface-soft);

            color:
                var(--text);

            font-size: 12px;

            transition:
                border-color .2s,
                box-shadow .2s,
                background .2s;
        }


        .field-input::placeholder {
            color:
                var(--muted);
        }


        .field-input:focus {
            border-color:
                var(--primary);

            box-shadow:
                0 0 0 3px
                rgba(49, 94, 251, .08);
        }


        .password-toggle {
            position: absolute;

            right: 10px;
            top: 50%;

            transform:
                translateY(-50%);

            width: 28px;
            height: 28px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;
            border-radius: 7px;

            background:
                transparent;

            color:
                var(--muted);

            cursor: pointer;

            font-size: 13px;
        }


        .password-toggle:hover {
            background:
                var(--surface);

            color:
                var(--text-secondary);
        }


        /* OPTIONS */

        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin:
                3px 0 20px;
        }


        .remember-wrap {
            display: flex;
            align-items: center;

            gap: 7px;
        }


        .remember-wrap input {
            width: 13px;
            height: 13px;

            accent-color:
                var(--primary);

            cursor: pointer;
        }


        .remember-wrap label {
            color:
                var(--text-secondary);

            font-size: 10px;

            cursor: pointer;
        }


        .forgot-button {
            border: none;
            background: none;

            color:
                var(--primary);

            font-size: 10px;

            cursor: pointer;
        }


        .forgot-button:hover {
            text-decoration: underline;
        }


        /* LOGIN BUTTON */

        .login-button {
            width: 100%;
            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            border: none;
            border-radius: 9px;

            background:
                var(--primary);

            color: #fff;

            font-size: 11px;
            font-weight: 700;

            cursor: pointer;

            transition:
                background .2s,
                transform .2s,
                box-shadow .2s;
        }


        .login-button:hover {
            background:
                var(--primary-hover);

            transform:
                translateY(-1px);

            box-shadow:
                0 7px 18px
                rgba(49, 94, 251, .18);
        }


        .login-button:active {
            transform:
                translateY(0);
        }


        .login-button:disabled {
            opacity: .65;

            cursor:
                not-allowed;

            transform:
                none;

            box-shadow:
                none;
        }


        .button-spinner {
            width: 14px;
            height: 14px;

            border:
                2px solid
                rgba(255,255,255,.35);

            border-top-color:
                #fff;

            border-radius: 50%;

            animation:
                spin .7s linear infinite;

            display: none;
        }


        .login-button.loading
        .button-spinner {
            display: block;
        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }

        }


        /* STATUS */

        .inline-status {
            min-height: 16px;

            margin-top: 11px;

            text-align: center;

            font-size: 10px;
        }


        .inline-status.success {
            color:
                var(--green);
        }


        .inline-status.error {
            color:
                var(--red);
        }


        /* FOOTER */

        .login-footer {
            padding:
                0 34px 25px;

            text-align: center;

            color:
                var(--muted);

            font-size: 9px;
        }


        .login-footer strong {
            color:
                var(--text-secondary);

            font-weight: 600;
        }


        /* THEME */

        .theme-button {
            position: absolute;

            top: 15px;
            right: 15px;

            width: 34px;
            height: 34px;

            display: flex;
            align-items: center;
            justify-content: center;

            border:
                1px solid
                var(--border);

            border-radius: 50%;

            background:
                var(--surface-soft);

            color:
                var(--muted);

            cursor: pointer;

            font-size: 14px;

            transition:
                .2s;
        }


        .theme-button:hover {
            color:
                var(--primary);

            border-color:
                var(--primary);
        }


        /* MODAL */

        .modal-overlay {
            position: fixed;

            inset: 0;

            z-index: 9999;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                rgba(10, 18, 32, .38);

            backdrop-filter:
                blur(5px);

            opacity: 0;
            visibility: hidden;

            transition:
                opacity .2s ease,
                visibility .2s ease;
        }


        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }


        .modal-card {
            position: relative;

            width: min(370px, 100%);

            padding:
                28px 25px 24px;

            border:
                1px solid
                var(--border);

            border-radius:
                16px;

            background:
                var(--surface);

            box-shadow:
                0 20px 60px
                rgba(10, 18, 32, .18);

            text-align: center;

            transform:
                translateY(10px)
                scale(.96);

            transition:
                transform .25s ease;
        }


        .modal-overlay.show
        .modal-card {
            transform:
                translateY(0)
                scale(1);
        }


        .modal-icon {
            width: 46px;
            height: 46px;

            margin:
                0 auto 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: 21px;
            font-weight: 800;
        }


        .modal-icon.error {
            background:
                var(--red-bg);

            color:
                var(--red);
        }


        .modal-icon.success {
            background:
                var(--green-bg);

            color:
                var(--green);
        }


        .modal-icon.info {
            background:
                var(--blue-bg);

            color:
                var(--primary);
        }


        .modal-title {
            margin-bottom: 6px;

            font-size: 16px;
        }


        .modal-text {
            color:
                var(--text-secondary);

            font-size: 11px;

            line-height: 1.6;
        }


        .modal-button {
            width: 100%;
            height: 38px;

            margin-top: 18px;

            border: none;
            border-radius: 8px;

            background:
                var(--primary);

            color: #fff;

            font-size: 11px;
            font-weight: 700;

            cursor: pointer;
        }


        .modal-button:hover {
            background:
                var(--primary-hover);
        }


        /* RESPONSIVE */

        @media (max-width: 500px) {

            body {
                padding:
                    14px;
            }

            .login-content {
                padding:
                    28px 22px 24px;
            }

            .login-footer {
                padding:
                    0 22px 21px;
            }

            .login-title {
                font-size: 21px;
            }

        }

    </style>
</head>


<body>


<div class="page-background">

    <div class="background-circle circle-one"></div>
    <div class="background-circle circle-two"></div>

</div>


<div class="login-wrapper">

    <div class="login-card">

        <div class="top-line"></div>


        <button
            class="theme-button"
            id="themeButton"
            type="button"
            title="Ganti tema"
        >
            ☀
        </button>


        <div class="login-content">


            <div class="brand">

                <div class="brand-icon">
                    N
                </div>


                <div class="brand-text">

                    <h1>
                        Nawala Monitor
                    </h1>

                    <p>
                        Monitoring Status Link
                    </p>

                </div>

            </div>


            <h2 class="login-title">
                Selamat Datang
            </h2>


            <p class="login-subtitle">
                Masuk untuk mengakses dashboard
                monitoring link kamu.
            </p>


            <form id="loginForm">


                <div class="form-group">

                    <div class="form-label-row">

                        <label
                            class="form-label"
                            for="username"
                        >
                            Username
                        </label>

                    </div>


                    <div class="field-wrap">

                        <span class="field-icon">
                            ◉
                        </span>

                        <input
                            class="field-input"
                            id="username"
                            name="username"
                            type="text"
                            placeholder="Masukkan username"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <div class="form-label-row">

                        <label
                            class="form-label"
                            for="password"
                        >
                            Password
                        </label>

                    </div>


                    <div class="field-wrap">

                        <span class="field-icon">
                            ◆
                        </span>


                        <input
                            class="field-input"
                            id="password"
                            name="password"
                            type="password"
                            placeholder="Masukkan password"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            class="password-toggle"
                            id="passwordToggle"
                            type="button"
                            title="Tampilkan password"
                        >
                            ◉
                        </button>

                    </div>

                </div>


                <div class="form-options">

                    <div class="remember-wrap">

                        <input
                            id="remember"
                            type="checkbox"
                        >

                        <label for="remember">
                            Ingat saya
                        </label>

                    </div>


                    <button
                        class="forgot-button"
                        id="forgotButton"
                        type="button"
                    >
                        Lupa password?
                    </button>

                </div>


                <button
                    class="login-button"
                    id="loginButton"
                    type="submit"
                >

                    <span
                        class="button-spinner"
                    ></span>

                    <span id="loginButtonText">
                        Masuk ke Dashboard
                    </span>

                </button>


                <div
                    class="inline-status"
                    id="inlineStatus"
                ></div>


            </form>

        </div>


        <div class="login-footer">

            <span>
                © 2026
                <strong>Nawala Monitor</strong>
                · Monitoring System
            </span>

        </div>

    </div>

</div>


<!-- CUSTOM MODAL -->

<div
    class="modal-overlay"
    id="modalOverlay"
    aria-hidden="true"
>

    <div
        class="modal-card"
        role="dialog"
        aria-modal="true"
    >

        <div
            class="modal-icon error"
            id="modalIcon"
        >
            !
        </div>


        <h3
            class="modal-title"
            id="modalTitle"
        >
            Login Gagal
        </h3>


        <p
            class="modal-text"
            id="modalText"
        >
            Username atau password salah.
        </p>


        <button
            class="modal-button"
            id="modalButton"
            type="button"
        >
            Tutup
        </button>

    </div>

</div>


<script>

    /*
     * URL GAS akan kita isi ketika sistem login
     * di Code.gs sudah dibuat.
     */
    const API_URL =
        "GANTI_DENGAN_URL_GAS_LOGIN";


    const loginForm =
        document.getElementById(
            "loginForm"
        );


    const usernameInput =
        document.getElementById(
            "username"
        );


    const passwordInput =
        document.getElementById(
            "password"
        );


    const passwordToggle =
        document.getElementById(
            "passwordToggle"
        );


    const loginButton =
        document.getElementById(
            "loginButton"
        );


    const loginButtonText =
        document.getElementById(
            "loginButtonText"
        );


    const inlineStatus =
        document.getElementById(
            "inlineStatus"
        );


    const rememberInput =
        document.getElementById(
            "remember"
        );


    const forgotButton =
        document.getElementById(
            "forgotButton"
        );


    const themeButton =
        document.getElementById(
            "themeButton"
        );


    const modalOverlay =
        document.getElementById(
            "modalOverlay"
        );


    const modalIcon =
        document.getElementById(
            "modalIcon"
        );


    const modalTitle =
        document.getElementById(
            "modalTitle"
        );


    const modalText =
        document.getElementById(
            "modalText"
        );


    const modalButton =
        document.getElementById(
            "modalButton"
        );


    function showModal(
        type,
        title,
        text
    ) {

        modalIcon.className =
            "modal-icon " +
            type;


        if (
            type ===
            "success"
        ) {

            modalIcon.textContent =
                "✓";

        } else if (
            type ===
            "info"
        ) {

            modalIcon.textContent =
                "i";

        } else {

            modalIcon.textContent =
                "!";

        }


        modalTitle.textContent =
            title;


        modalText.textContent =
            text;


        modalOverlay.classList.add(
            "show"
        );


        modalOverlay.setAttribute(
            "aria-hidden",
            "false"
        );

    }


    function closeModal() {

        modalOverlay.classList.remove(
            "show"
        );


        modalOverlay.setAttribute(
            "aria-hidden",
            "true"
        );

    }


    function setLoading(
        loading
    ) {

        loginButton.disabled =
            loading;


        if (loading) {

            loginButton.classList.add(
                "loading"
            );


            loginButtonText.textContent =
                "Memeriksa...";

        } else {

            loginButton.classList.remove(
                "loading"
            );


            loginButtonText.textContent =
                "Masuk ke Dashboard";

        }

    }


    function showInlineStatus(
        text,
        type
    ) {

        inlineStatus.textContent =
            text;


        inlineStatus.className =
            "inline-status " +
            (type || "");

    }


    function loadTheme() {

        const savedTheme =
            localStorage.getItem(
                "nawalaLoginTheme"
            );


        if (
            savedTheme ===
            "dark"
        ) {

            document.body.classList.add(
                "dark"
            );


            themeButton.textContent =
                "☀";

        } else {

            document.body.classList.remove(
                "dark"
            );


            themeButton.textContent =
                "☾";

        }

    }


    function toggleTheme() {

        const dark =
            document.body.classList.toggle(
                "dark"
            );


        localStorage.setItem(
            "nawalaLoginTheme",
            dark
                ? "dark"
                : "light"
        );


        themeButton.textContent =
            dark
                ? "☀"
                : "☾";

    }


    function loadRememberedUsername() {

        const savedUsername =
            localStorage.getItem(
                "nawalaRememberUsername"
            );


        if (
            savedUsername
        ) {

            usernameInput.value =
                savedUsername;


            rememberInput.checked =
                true;

        }

    }


    passwordToggle.addEventListener(
        "click",
        function() {

            const showing =
                passwordInput.type ===
                "text";


            passwordInput.type =
                showing
                    ? "password"
                    : "text";


            passwordToggle.textContent =
                showing
                    ? "◉"
                    : "◍";

        }
    );


    themeButton.addEventListener(
        "click",
        toggleTheme
    );


    modalButton.addEventListener(
        "click",
        closeModal
    );


    modalOverlay.addEventListener(
        "click",
        function(event) {

            if (
                event.target ===
                modalOverlay
            ) {

                closeModal();

            }

        }
    );


    document.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key ===
                "Escape"
            ) {

                closeModal();

            }

        }
    );


    forgotButton.addEventListener(
        "click",
        function() {

            showModal(
                "info",
                "Lupa Password",
                "Hubungi administrator Nawala Monitor untuk mendapatkan bantuan login."
            );

        }
    );


    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const username =
                usernameInput.value.trim();


            const password =
                passwordInput.value;


            if (!username) {

                showModal(
                    "error",
                    "Username Kosong",
                    "Silakan masukkan username terlebih dahulu."
                );

                usernameInput.focus();

                return;

            }


            if (!password) {

                showModal(
                    "error",
                    "Password Kosong",
                    "Silakan masukkan password terlebih dahulu."
                );

                passwordInput.focus();

                return;

            }


            if (
                !API_URL ||
                API_URL ===
                    "GANTI_DENGAN_URL_GAS_LOGIN"
            ) {

                showModal(
                    "error",
                    "Sistem Belum Terhubung",
                    "Endpoint login GAS belum dipasang."
                );

                return;

            }


            if (
                rememberInput.checked
            ) {

                localStorage.setItem(
                    "nawalaRememberUsername",
                    username
                );

            } else {

                localStorage.removeItem(
                    "nawalaRememberUsername"
                );

            }


            setLoading(
                true
            );


            showInlineStatus(
                "Menghubungi server...",
                ""
            );


            try {

                const callbackName =
                    "loginCallback_" +
                    Date.now();


                const script =
                    document.createElement(
                        "script"
                    );


                const params =
                    new URLSearchParams({
                        action:
                            "login",

                        username:
                            username,

                        password:
                            password,

                        callback:
                            callbackName

                    });


                const cleanup =
                    function() {

                        delete window[
                            callbackName
                        ];


                        if (
                            script.parentNode
                        ) {

                            script.parentNode.removeChild(
                                script
                            );

                        }

                    };


                const timeout =
                    setTimeout(
                        function() {

                            cleanup();

                            setLoading(
                                false
                            );


                            showInlineStatus(
                                "Server tidak merespons.",
                                "error"
                            );


                            showModal(
                                "error",
                                "Koneksi Gagal",
                                "Server login tidak merespons. Coba lagi beberapa saat."
                            );

                        },
                        15000
                    );


                window[
                    callbackName
                ] =
                    function(result) {

                        clearTimeout(
                            timeout
                        );


                        cleanup();


                        setLoading(
                            false
                        );


                        if (
                            result &&
                            result.success
                        ) {

                            showInlineStatus(
                                "Login berhasil.",
                                "success"
                            );


                            showModal(
                                "success",
                                "Login Berhasil",
                                "Selamat datang. Dashboard akan dibuka."
                            );


                            /*
                             * Untuk sementara setelah login:
                             * dashboard/index.html
                             *
                             * Nanti setelah sistem session
                             * selesai, URL ini kita sesuaikan.
                             */
                            setTimeout(
                                function() {

                                    window.location.href =
                                        "index.html";

                                },
                                900
                            );


                        } else {

                            showInlineStatus(
                                result &&
                                result.message
                                    ? result.message
                                    : "Username atau password salah.",
                                "error"
                            );


                            showModal(
                                "error",
                                "Login Gagal",
                                result &&
                                result.message
                                    ? result.message
                                    : "Username atau password salah."
                            );

                        }

                    };


                script.onerror =
                    function() {

                        clearTimeout(
                            timeout
                        );


                        cleanup();


                        setLoading(
                            false
                        );


                        showInlineStatus(
                            "Gagal menghubungi server.",
                            "error"
                        );


                        showModal(
                            "error",
                            "Koneksi Gagal",
                            "Tidak dapat terhubung ke server login."
                        );

                    };


                script.src =
                    API_URL +
                    "?" +
                    params.toString();


                document.body.appendChild(
                    script
                );


            } catch (error) {

                console.error(
                    "LOGIN ERROR:",
                    error
                );


                setLoading(
                    false
                );


                showInlineStatus(
                    "Terjadi kesalahan.",
                    "error"
                );


                showModal(
                    "error",
                    "Terjadi Kesalahan",
                    "Login tidak dapat diproses saat ini."
                );

            }

        }
    );


    loadTheme();


    loadRememberedUsername();

</script>

</body>
</html>
